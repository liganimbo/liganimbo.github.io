# Publica la web en GitHub Pages cada vez que se sube algo a main (y cada tarde durante los Amistosos de Navidad).
# La web se construye con los datos que haya en datos/ (la liga se avanza en local con npm run liga).
name: Publicar web

on:
  push:
    branches: [main]
  # Amistosos de Navidad: cada tarde se reconstruye para publicar la crónica del día (la web solo enseña los ya jugados).
  # 17:00 UTC = 18:00 en Madrid, antes del Reel de las 20:00.
  schedule:
    - cron: "0 17 18-31 12 *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          # Un repositorio <usuario>.github.io se publica en la raíz; cualquier otro, en /<repositorio>/.
          BASE: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name) }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
